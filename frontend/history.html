<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ShopMind AI — History</title>
<link rel="stylesheet" href="css/style.css"/>
<style>
* { box-sizing: border-box; }
html, body { margin:0; min-height:100%; }
.page { display:flex; flex-direction:column; min-height:100vh; }

/* Header */
.page-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 32px; background:rgba(8,8,17,0.97);
  border-bottom:1px solid var(--line); backdrop-filter:blur(20px);
  position:sticky; top:0; z-index:50;
}
.logo { display:flex; align-items:center; gap:10px; text-decoration:none; }
.logo-icon { width:32px; height:32px; border-radius:9px; background:linear-gradient(135deg,var(--saffron),var(--saffron-2)); display:flex; align-items:center; justify-content:center; font-size:17px; }
.logo-name { font-family:var(--font-display); font-size:18px; font-weight:500; color:var(--saffron-2); }

/* Content */
.page-content { flex:1; max-width:760px; margin:0 auto; width:100%; padding:32px 24px 60px; }
.page-title { font-family:var(--font-display); font-size:28px; font-weight:300; color:var(--snow); margin-bottom:6px; }
.page-title em { color:var(--saffron); font-style:italic; }

/* Stats */
.stats-bar { display:flex; gap:12px; margin-bottom:24px; }
.stat-card { flex:1; padding:14px 18px; background:var(--ink-2); border:1px solid var(--line); border-radius:var(--radius-lg); }
.stat-number { font-family:var(--font-display); font-size:26px; font-weight:500; color:var(--saffron); }
.stat-label { font-size:11px; color:var(--fog); font-family:var(--font-mono); margin-top:2px; }

/* Filter */
.filter-bar { display:flex; align-items:center; gap:10px; padding:10px 14px; background:var(--ink-2); border:1px solid var(--line); border-radius:var(--radius); margin-bottom:20px; }
.filter-bar input { flex:1; background:transparent; border:none; color:var(--snow); font-size:14px; font-family:var(--font-body); outline:none; }
.filter-bar input::placeholder { color:var(--fog); }

/* Date label */
.date-label { font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--fog); font-family:var(--font-mono); padding:16px 4px 8px; }

/* Chat item — same on all screens */
.chat-item {
  display:flex; align-items:center; gap:12px;
  padding:14px 16px; background:var(--ink-2);
  border:1px solid var(--line); border-radius:var(--radius);
  margin-bottom:8px; transition:all 0.2s;
}
.chat-item:hover { border-color:rgba(255,153,51,0.25); }
.chat-icon { width:36px; height:36px; border-radius:9px; background:var(--saffron-d); border:1px solid rgba(255,153,51,0.2); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
.chat-info { flex:1; min-width:0; }
.chat-query { font-size:13px; font-weight:500; color:var(--snow); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.chat-time { font-size:10px; color:var(--fog); font-family:var(--font-mono); margin-top:3px; }
.chat-actions { display:flex; gap:6px; flex-shrink:0; }
.chat-view { padding:7px 12px; border-radius:7px; background:var(--saffron-d); border:1px solid rgba(255,153,51,0.2); color:var(--saffron); font-size:12px; cursor:pointer; font-family:var(--font-body); transition:all 0.2s; white-space:nowrap; }
.chat-view:hover { background:rgba(255,153,51,0.15); }
.chat-del { padding:7px 12px; border-radius:7px; background:var(--ruby-d); border:1px solid rgba(244,63,94,0.2); color:var(--ruby); font-size:12px; cursor:pointer; font-family:var(--font-body); transition:all 0.2s; }
.chat-del:hover { background:rgba(244,63,94,0.15); }

/* Result modal */
.modal-overlay { position:fixed; inset:0; z-index:500; background:rgba(0,0,0,0.7); backdrop-filter:blur(8px); display:none; align-items:center; justify-content:center; padding:20px; }
.modal-overlay.open { display:flex; }
.modal { background:var(--ink-2); border:1px solid var(--line-2); border-radius:var(--radius-xl); padding:28px; max-width:680px; width:100%; box-shadow:0 24px 80px rgba(0,0,0,0.5); animation:fadeUp 0.3s ease; }
.modal-body { max-height:70vh; overflow-y:auto; margin-top:16px; }
.modal-body::-webkit-scrollbar { width:4px; }
.modal-body::-webkit-scrollbar-thumb { background:var(--line); border-radius:4px; }
.mini-card { background:var(--ink-3); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:10px; display:flex; gap:12px; }
.mini-rank { width:28px; height:28px; border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; font-family:var(--font-mono); flex-shrink:0; }
.r1 { background:rgba(245,200,66,0.12); color:#f5c842; border:1px solid rgba(245,200,66,0.3); }
.r2 { background:rgba(148,163,184,0.1); color:#94a3b8; border:1px solid rgba(148,163,184,0.2); }
.r3 { background:rgba(205,127,50,0.1); color:#cd7f32; border:1px solid rgba(205,127,50,0.2); }
.rn { background:var(--ink-4); color:var(--fog); border:1px solid var(--line); }
.mini-info { flex:1; min-width:0; }
.mini-name { font-size:13px; font-weight:600; color:var(--snow); }
.mini-price { font-family:var(--font-display); font-size:20px; color:var(--saffron); margin-top:2px; }
.mini-score { font-size:11px; color:var(--mist); font-family:var(--font-mono); margin-top:2px; }
.mini-buy { display:inline-flex; align-items:center; gap:5px; padding:5px 11px; border-radius:7px; background:linear-gradient(135deg,var(--saffron),var(--saffron-2)); color:var(--ink); font-size:11px; font-weight:600; text-decoration:none; margin-top:8px; }

/* Footer */
.page-footer { text-align:center; padding:24px 16px 32px; border-top:1px solid var(--line); }

@keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

/* Mobile */
@media(max-width:600px) {
  .page-header { padding:12px 16px; }
  .logo-name { font-size:16px; }
  .page-content { padding:20px 14px 80px; }
  .page-title { font-size:22px; }
  .stats-bar { gap:8px; }
  .stat-card { padding:12px 14px; }
  .stat-number { font-size:22px; }
  .chat-item { padding:12px; gap:10px; }
  .chat-query { font-size:12px; }
  .chat-view, .chat-del { padding:6px 10px; font-size:11px; }
  .modal { padding:18px 14px; margin:10px; }
}
</style>
</head>
<body>
<div class="page-bg"></div>

<!-- Modal -->
<div class="modal-overlay" id="resultModal">
  <div class="modal">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div style="font-family:var(--font-display);font-size:18px;color:var(--saffron-2)" id="modalTitle">Result</div>
      <button class="btn btn-ghost btn-sm btn-icon" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div style="margin-top:16px;display:flex;gap:10px;justify-content:flex-end">
      <a class="btn btn-primary btn-sm" href="/dashboard">🔍 Search Again</a>
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">Close</button>
    </div>
  </div>
</div>

<div class="page">
  <header class="page-header">
    <a class="logo" href="/dashboard">
      <div class="logo-icon">🛍️</div>
      <span class="logo-name">ShopMind AI</span>
    </a>
    <div style="display:flex;gap:8px;align-items:center">
      <button onclick="confirmClearAll()" style="padding:8px 14px;background:var(--ruby-d);color:var(--ruby);border:1px solid rgba(244,63,94,0.25);border-radius:var(--radius);font-size:13px;cursor:pointer;font-family:var(--font-body)">🗑️ Clear All</button>
      <a class="btn btn-primary btn-sm" href="/dashboard">← Back</a>
    </div>
  </header>

  <div class="page-content">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
      <h1 class="page-title">Your <em>search history</em></h1>
      <div class="badge badge-saffron" id="totalCount">Loading...</div>
    </div>

    <div class="stats-bar">
      <div class="stat-card"><div class="stat-number" id="statTotal">0</div><div class="stat-label">Total</div></div>
      <div class="stat-card"><div class="stat-number" id="statToday">0</div><div class="stat-label">Today</div></div>
      <div class="stat-card"><div class="stat-number" id="statSessions">0</div><div class="stat-label">Sessions</div></div>
    </div>

    <div class="filter-bar">
      <span style="color:var(--fog)">🔍</span>
      <input type="text" placeholder="Filter searches..." id="filterInput" oninput="filterHistory()"/>
    </div>

    <div id="historyContainer">
      <div class="empty-state" style="padding:60px 0">
        <div class="icon">⏳</div>
        <div class="title">Loading...</div>
      </div>
    </div>
  </div>

  <footer class="page-footer">
    <div style="font-size:9px;color:var(--fog);font-family:var(--font-mono);letter-spacing:2px;text-transform:uppercase">Built &amp; Designed by</div>
    <div style="font-size:16px;font-weight:600;color:var(--saffron-2);font-family:var(--font-display);margin-top:4px">Aditya Singh</div>
    <div style="font-size:10px;color:var(--fog);font-family:var(--font-mono);margin-top:4px;opacity:0.6">ShopMind AI © 2025</div>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/search.js"></script>
<script src="js/history.js"></script>
<script>
let allChats = [];

(async () => {
  const session = await requireAuth();
  if (!session) return;
  loadAll();
})();

async function loadAll() {
  try {
    const result = await fetchHistory();
    // fetchHistory returns array directly
    allChats = Array.isArray(result) ? result : (result.chats || result);
    const plan = Array.isArray(result) ? 'free' : (result.plan || 'free');

    renderHistory(allChats);
    updateStats(allChats);
    document.getElementById('totalCount').textContent = `${allChats.length} searches`;

    // Show upgrade banner for free users
    if (plan === 'free' && allChats.length >= 10) {
      const banner = document.createElement('div');
      banner.style.cssText = 'background:var(--saffron-d);border:1px solid rgba(255,153,51,0.3);border-radius:var(--radius-lg);padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;';
      banner.innerHTML = `
        <div>
          <div style="font-size:13px;font-weight:600;color:var(--saffron)">⭐ Showing last 10 searches only</div>
          <div style="font-size:12px;color:var(--mist);margin-top:2px">Upgrade to Pro to unlock your full history</div>
        </div>
        <a href="/pricing" style="padding:8px 16px;background:linear-gradient(135deg,var(--saffron),var(--saffron-2));color:var(--ink);border-radius:var(--radius);font-size:12px;font-weight:700;text-decoration:none;white-space:nowrap">Upgrade ₹99</a>`;
      document.querySelector('.filter-bar').before(banner);
    }
  } catch(e) {
    document.getElementById('historyContainer').innerHTML =
      `<div class="error-banner"><span>⚠️</span><span>${esc(e.message)}</span></div>`;
  }
}

function renderHistory(chats) {
  const container = document.getElementById('historyContainer');
  if (!chats.length) {
    container.innerHTML = `<div class="empty-state" style="padding:60px 0">
      <div class="icon">📭</div>
      <div class="title">No searches yet</div>
      <div class="desc">Go back and search for any product!</div>
    </div>`;
    return;
  }

  // Group by date
  const now = Date.now();
  const groups = { 'Today':[], 'Yesterday':[], 'This Week':[], 'Older':[] };
  for (const c of chats) {
    const diff = now - new Date(c.created_at);
    if      (diff < 86400000)  groups['Today'].push(c);
    else if (diff < 172800000) groups['Yesterday'].push(c);
    else if (diff < 604800000) groups['This Week'].push(c);
    else                       groups['Older'].push(c);
  }

  let html = '';
  for (const [label, group] of Object.entries(groups)) {
    if (!group.length) continue;
    html += `<div class="date-label">${label}</div>`;
    html += group.map(c => `
      <div class="chat-item">
        <div class="chat-icon">🔍</div>
        <div class="chat-info">
          <div class="chat-query">${esc(c.query)}</div>
          <div class="chat-time">${timeAgo(c.created_at)}</div>
        </div>
        <div class="chat-actions">
          <button class="chat-view" onclick="viewResult('${esc(c.id)}','${esc(c.query).replace(/'/g,"\\'")}')">👁️ View</button>
          <button class="chat-del" onclick="deleteOneChat('${esc(c.id)}')">🗑️</button>
        </div>
      </div>`).join('');
  }
  container.innerHTML = html;
}

function updateStats(chats) {
  const now = Date.now();
  document.getElementById('statTotal').textContent    = chats.length;
  document.getElementById('statToday').textContent    = chats.filter(c => now - new Date(c.created_at) < 86400000).length;
  document.getElementById('statSessions').textContent = new Set(chats.map(c => c.session_id)).size;
}

function filterHistory() {
  const q = document.getElementById('filterInput').value.toLowerCase();
  renderHistory(allChats.filter(c => c.query.toLowerCase().includes(q)));
}

async function deleteOneChat(id) {
  if (!confirm('Delete this search?')) return;
  try {
    await deleteChat(id);
    allChats = allChats.filter(c => c.id !== id);
    renderHistory(allChats);
    updateStats(allChats);
    document.getElementById('totalCount').textContent = `${allChats.length} searches`;
    showToast('Deleted!', 'success');
  } catch(e) { showToast(e.message, 'error'); }
}

async function confirmClearAll() {
  if (!confirm('Delete ALL history? This cannot be undone.')) return;
  try {
    await clearAllHistory();
    allChats = [];
    renderHistory([]);
    updateStats([]);
    document.getElementById('totalCount').textContent = '0 searches';
    showToast('All cleared!', 'success');
  } catch(e) { showToast(e.message, 'error'); }
}

async function viewResult(id, query) {
  document.getElementById('modalTitle').textContent = query;
  document.getElementById('modalBody').innerHTML = '<div style="text-align:center;padding:20px"><div class="spinner"></div></div>';
  document.getElementById('resultModal').classList.add('open');
  try {
    const chat = await fetchChat(id);
    const products = chat.response?.products || [];
    if (!products.length) {
      document.getElementById('modalBody').innerHTML = '<div class="empty-state"><div class="title">No product data saved</div></div>';
      return;
    }
    const rankClass = ['r1','r2','r3','rn'];
    document.getElementById('modalBody').innerHTML = products.map((p, i) => {
      const buyLink = p.buy_links?.[0];
      return `<div class="mini-card">
        <div class="mini-rank ${rankClass[i]||'rn'}">#${i+1}</div>
        <div class="mini-info">
          <div class="mini-name">${esc(p.name||'')}</div>
          <div class="mini-price">${esc(p.best_price||'N/A')}</div>
          <div class="mini-score">⭐ ${Number(p.overall_score||0).toFixed(1)}/10 · ${esc(p.best_platform||'')}</div>
          ${buyLink ? `<a class="mini-buy" href="${buyLink.url}" target="_blank" rel="noopener">🛒 ${esc(buyLink.platform)}</a>` : ''}
        </div>
      </div>`;
    }).join('');
  } catch(e) {
    document.getElementById('modalBody').innerHTML = `<div class="error-banner"><span>⚠️</span><span>${esc(e.message)}</span></div>`;
  }
}

function closeModal() { document.getElementById('resultModal').classList.remove('open'); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
</script>
</body>
</html>
